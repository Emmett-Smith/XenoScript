language: plinth
display_name: PLINTH
extension: .plth
comment_prefix: "#"

verifier:
  parse:   ["python3", "languages/plinth/plinth/cli.py", "parse", "--json", "{file}"]
  run:     ["python3", "languages/plinth/plinth/cli.py", "run", "--json", "{file}"]
  symbols: ["python3", "languages/plinth/plinth/cli.py", "symbols", "--json"]

sandbox:
  mode: subprocess
  timeout_s: 10
  memory_mb: 512

retrieval:
  bm25_weight: 0.75
  embedding_weight: 0.25
  chunk_strategy: heading
