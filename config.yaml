# Ashlar top-level config. Corpus specifics live in corpora/<name>/meta.yaml.
# This file plus meta.yaml is the whole surface for adding a language.

corpus: stub          # name of a folder under corpora/

model:
  base_url: http://localhost:11434/v1
  # Model choice is deliberately not fixed here (00_ARCHITECTURE.md #10).
  # Re-probed `curl -s http://localhost:11434/api/tags` during the harness
  # build session (03_HARNESS.md re-probe instruction) and found this model
  # landed. It is the only model available tonight, so it's recorded here
  # without a real bake-off -- see TASKS.md "Chosen model" for the caveat.
  name: "qwen2.5-coder:3b"
  api_key: ollama
  temperature: 0.1
  max_tokens: 2048
  request_timeout_s: 120

harness:
  max_iter: 4
  task_budget_s: 300

sandbox:
  mode: subprocess    # pre-decided for this session; container path is stubbed, not implemented

api:
  host: 127.0.0.1
  port: 8000
