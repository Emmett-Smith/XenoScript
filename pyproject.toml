[project]
name = "ashlar"
version = "0.1.0"
description = "A coding assistant for languages no model has seen."
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.0.0,<2.0.0",  # mcp 2.x renamed mcp.server.fastmcp.FastMCP; 00_ARCHITECTURE.md #6 / 02_BACKEND.md #3 specify the 1.x import verbatim
  "openai>=1.0.0",
  "fastapi>=0.110.0",
  "uvicorn>=0.29.0",
  "rank-bm25>=0.2.2",
  "pyyaml>=6.0",
  "sse-starlette>=2.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0",
  "httpx>=0.27.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# Every MCP tool must swallow all exceptions and return {"error": ...}
# rather than raising to the model (specs/02_BACKEND.md #3) -- the blind
# except is intentional here, not an oversight.
"ashlar/mcp/server.py" = ["BLE001"]

[tool.pytest.ini_options]
testpaths = ["ashlar", "eval"]
